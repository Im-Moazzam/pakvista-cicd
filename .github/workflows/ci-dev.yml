name: ci-dev

on:
  pull_request:
    branches: [develop]

jobs:
  ci-dev:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd
      TAG_PREFIX: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Build with Parcel
        run: npm run build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG_PREFIX }}-build

      - name: Tag Image
        run: |
          echo "IMAGE_TAG_LATEST=${IMAGE_NAME}:${TAG_PREFIX}-latest" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${IMAGE_NAME}:${TAG_PREFIX}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "Prepared tags: ${IMAGE_NAME}:${TAG_PREFIX}-latest and ${IMAGE_NAME}:${TAG_PREFIX}-${GITHUB_SHA}"

      - name: Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_TAG_LATEST }}
            ${{ env.IMAGE_TAG_SHA }}